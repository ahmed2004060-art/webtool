<script>
/* تحميل المكتبة وملف الإضاءة من تخزين الهاتف (نفس قاعدة mujassam_store) وإلا من الإنترنت ثم حفظهما */
(function(){
  const DBN="mujassam_store",ST="f";
  function idb(){return new Promise((ok,no)=>{const q=indexedDB.open(DBN,1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains(ST))q.result.createObjectStore(ST);};q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error);q.onblocked=()=>no(new Error("blocked"));});}
  async function gt(k){const d=await idb();try{return await new Promise((ok,no)=>{const r=d.transaction(ST,"readonly").objectStore(ST).get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);});}finally{d.close();}}
  async function pt(k,v){const d=await idb();try{await new Promise((ok,no)=>{const t=d.transaction(ST,"readwrite");t.objectStore(ST).put(v,k);t.oncomplete=ok;t.onerror=()=>no(t.error);t.onabort=()=>no(t.error);});}finally{d.close();}}
  async function lib(k,url,type){
    let rec=null;try{rec=await gt(k);}catch(e){}
    if(rec&&rec.b)return rec.b;
    const r=await fetch(url);if(!r.ok)throw new Error("HTTP "+r.status);
    const b=await r.arrayBuffer();
    if(b.byteLength<1000)throw new Error("ملف غير صالح");
    try{await pt(k,{b:b,t:type});}catch(e){}
    return b;
  }
  function inject(src){return new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=()=>no(new Error("script"));document.head.appendChild(s);});}
  window.__libP=(async()=>{
    const pe=lib("lib/environmentSpecular.env","https://assets.babylonjs.com/environments/environmentSpecular.env","application/octet-stream")
      .then(b=>{window.__envUrl=URL.createObjectURL(new Blob([b]));}).catch(()=>{});
    try{
      const b=await lib("lib/babylon.js","https://cdn.babylonjs.com/babylon.js","text/javascript");
      await inject(URL.createObjectURL(new Blob([b],{type:"text/javascript"})));
    }catch(e){
      try{await inject("https://cdn.babylonjs.com/babylon.js");}catch(e2){}
    }
    await pe;
  })();
})();
</script>
<script>
/* ===== حفظ المحمَّل على الهاتف: نظام مستقل يلتف حول الجلب ولا يغيّر منطق الصفحة ===== */
(function(){
  const orig=window.fetch.bind(window);
  const DBN="mujassam_store",ST="f";
  let dbp=null,cnt=0,hits=0,wrote=0,fast=0;
  function req(r){return new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);});}
  function db(){
    if(dbp)return dbp;
    dbp=new Promise((ok,no)=>{
      try{
        const q=indexedDB.open(DBN,1);
        q.onupgradeneeded=()=>{q.result.createObjectStore(ST);};
        q.onsuccess=()=>{const d=q.result;d.onversionchange=()=>{try{d.close();}catch(e){}dbp=null;};ok(d);};
        q.onerror=()=>no(q.error);
        q.onblocked=()=>no(new Error("blocked"));
      }catch(e){no(e);}
    });
    dbp.catch(()=>{dbp=null;});
    return dbp;
  }
  async function get(k){const d=await db();return req(d.transaction(ST,"readonly").objectStore(ST).get(k));}
  async function put(k,v){const d=await db();return new Promise((ok,no)=>{const t=d.transaction(ST,"readwrite");t.objectStore(ST).put(v,k);t.oncomplete=ok;t.onerror=()=>no(t.error);t.onabort=()=>no(t.error);});}
  async function refresh(){try{const d=await db();cnt=await req(d.transaction(ST,"readonly").objectStore(ST).count());}catch(e){}return cnt;}
  function key(u){
    u=u.split(/[?#]/)[0];let m;
    if((m=u.match(/^https:\/\/raw\.githubusercontent\.com\/makehumancommunity\/makehuman\/master\/makehuman\/data\/(.+)$/)))return "mh/"+m[1];
    if((m=u.match(/^https:\/\/cdn\.jsdelivr\.net\/gh\/makehumancommunity\/makehuman@master\/makehuman\/data\/(.+)$/)))return "mh/"+m[1];
    if((m=u.match(/^https:\/\/(?:raw\.githubusercontent\.com|media\.githubusercontent\.com\/media)\/makehumancommunity\/makehuman-assets\/master\/(.+)$/)))return "as/"+m[1];
    if((m=u.match(/^https:\/\/cdn\.jsdelivr\.net\/gh\/makehumancommunity\/makehuman-assets@master\/(.+)$/)))return "as/"+m[1];
    return null;
  }
  function isLfs(b){if(b.byteLength>=300)return false;try{return new TextDecoder().decode(new Uint8Array(b)).startsWith("version https://git-lfs");}catch(e){return false;}}
  const LOCAL=new Map();
  let KEYS=null;
  async function keyset(){if(KEYS)return KEYS;try{const d=await db();KEYS=new Set(await req(d.transaction(ST,"readonly").objectStore(ST).getAllKeys()));}catch(e){KEYS=null;}return KEYS;}
  window.fetch=async function(input,init){
    if(typeof input==="string"&&LOCAL.has(input)){
      /* ملف حزمة مختار من الهاتف: يُخدَم بالأجزاء بدون أي إنترنت */
      const f=LOCAL.get(input),meth=String((init&&init.method)||"GET").toUpperCase();
      if(meth==="HEAD")return new Response(null,{status:200,headers:{"content-length":String(f.size)}});
      const hd=init&&init.headers,rg=hd&&(hd.Range||hd.range),mm=rg&&String(rg).match(/bytes=(\d+)-(\d*)/);
      if(mm){const a=+mm[1],b=mm[2]===""?f.size-1:Math.min(+mm[2],f.size-1);return new Response(f.slice(a,b+1),{status:206,headers:{"content-range":"bytes "+a+"-"+b+"/"+f.size}});}
      return new Response(f,{status:200});
    }
    let k=null;
    try{
      const meth=String((init&&init.method)||"GET").toUpperCase();
      const h=init&&init.headers;
      const rg=h&&(h.Range||h.range||(typeof h.get==="function"&&h.get("Range")));
      const ns=init&&init.cache==="no-store";
      if(typeof input==="string"&&meth==="GET"&&!rg&&!ns)k=key(input);
    }catch(e){k=null;}
    if(k){
      try{
        const ks=await keyset();
        const rec=(ks&&!ks.has(k))?null:await get(k);
        if(rec&&rec.b){hits++;return new Response(rec.b,{status:200,headers:{"content-type":rec.t||"application/octet-stream"}});}
      }catch(e){}
    }
    let r=null;
    if(k){
      /* يحاول أولاً من ذاكرة المتصفح القديمة (ما حُمِّل في الإصدارات السابقة)، وإن لم يجد يحمّل من الإنترنت */
      const t0=performance.now();
      try{
        const c=await orig(input,Object.assign({},init,{cache:"force-cache"}));
        if(c.ok){r=c;if(performance.now()-t0<40)fast++;}
        else if(c.status===404)r=c;
      }catch(e){}
    }
    if(!r)r=await orig(input,init);
    if(k&&r.status===200){
      try{
        r.clone().arrayBuffer().then(async b=>{
          if(isLfs(b))return;
          await put(k,{b:b,t:r.headers.get("content-type")||""});
          if(KEYS)KEYS.add(k);
          wrote++;cnt++;
        }).catch(()=>{});
      }catch(e){}
    }
    return r;
  };
  const CT=(function(){const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let j=0;j<8;j++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
  function crc(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CT[(c^u8[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
  async function exportZip(say){
    const d=await db();
    const keys=await req(d.transaction(ST,"readonly").objectStore(ST).getAllKeys());
    if(!keys.length)throw new Error("لا يوجد شيء محفوظ بعد");
    if(keys.length>65535)throw new Error("عدد الملفات أكبر من حد صيغة الأرشيف");
    const te=new TextEncoder(),blobs=[],cd=[];let cur=[],curSz=0,off=0;
    const push=u8=>{cur.push(u8);curSz+=u8.length;off+=u8.length;if(curSz>64*1048576){blobs.push(new Blob(cur));cur=[];curSz=0;}};
    for(let i=0;i<keys.length;i++){
      const k=keys[i],rec=await get(k);if(!rec||!rec.b)continue;
      const data=new Uint8Array(rec.b),nm=te.encode(k),c=crc(data);
      const lh=new DataView(new ArrayBuffer(30));
      lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,0,true);lh.setUint16(12,0x21,true);
      lh.setUint32(14,c,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);lh.setUint16(26,nm.length,true);lh.setUint16(28,0,true);
      const start=off;
      push(new Uint8Array(lh.buffer));push(nm);push(data);
      cd.push({nm:nm,c:c,sz:data.length,start:start});
      if(off>0xFFFFFF00)throw new Error("الحجم أكبر من حد صيغة الأرشيف");
      if(i%25==0){if(say)say(i+" من "+keys.length);await new Promise(r=>setTimeout(r,0));}
    }
    const cdStart=off;
    for(const e of cd){
      const h=new DataView(new ArrayBuffer(46));
      h.setUint32(0,0x02014b50,true);h.setUint16(4,20,true);h.setUint16(6,20,true);h.setUint16(8,0x0800,true);h.setUint16(10,0,true);h.setUint16(12,0,true);h.setUint16(14,0x21,true);
      h.setUint32(16,e.c,true);h.setUint32(20,e.sz,true);h.setUint32(24,e.sz,true);h.setUint16(28,e.nm.length,true);
      h.setUint32(42,e.start,true);
      push(new Uint8Array(h.buffer));push(e.nm);
    }
    const cdSize=off-cdStart;
    const eo=new DataView(new ArrayBuffer(22));
    eo.setUint32(0,0x06054b50,true);eo.setUint16(8,cd.length,true);eo.setUint16(10,cd.length,true);eo.setUint32(12,cdSize,true);eo.setUint32(16,cdStart,true);
    push(new Uint8Array(eo.buffer));
    if(cur.length)blobs.push(new Blob(cur));
    return {blob:new Blob(blobs,{type:"application/zip"}),n:cd.length,size:off};
  }
  async function putMany(list){const d=await db();return new Promise((ok,no)=>{const t=d.transaction(ST,"readwrite"),o=t.objectStore(ST);for(const [k,v] of list){o.put(v,k);if(KEYS)KEYS.add(k);}t.oncomplete=ok;t.onerror=()=>no(t.error);t.onabort=()=>no(t.error);});}
  async function inflate(u8){const ds=new DecompressionStream("deflate-raw"),w=ds.writable.getWriter();w.write(u8);w.close();return new Uint8Array(await new Response(ds.readable).arrayBuffer());}
  async function importZip(file,say){
    const sz=file.size,tail=new Uint8Array(await file.slice(Math.max(0,sz-65600),sz).arrayBuffer());
    let e=-1;for(let i=tail.length-22;i>=0;i--){if(tail[i]==0x50&&tail[i+1]==0x4b&&tail[i+2]==5&&tail[i+3]==6){e=i;break;}}
    if(e<0)throw new Error("الملف ليس أرشيف zip صالحاً");
    const dv=new DataView(tail.buffer,tail.byteOffset,tail.byteLength);
    const n=dv.getUint16(e+10,true),cdSize=dv.getUint32(e+12,true),cdOff=dv.getUint32(e+16,true);
    if(cdOff===0xFFFFFFFF||n===0xFFFF)throw new Error("الأرشيف أكبر من الحد المدعوم");
    const cd=new Uint8Array(await file.slice(cdOff,cdOff+cdSize).arrayBuffer()),cv=new DataView(cd.buffer),td=new TextDecoder();
    const ents=[];let p=0,skipped=0;
    for(let i=0;i<n;i++){
      if(cv.getUint32(p,true)!==0x02014b50)break;
      const meth=cv.getUint16(p+10,true),csz=cv.getUint32(p+20,true),nl=cv.getUint16(p+28,true),xl=cv.getUint16(p+30,true),cl=cv.getUint16(p+32,true),lo=cv.getUint32(p+42,true);
      const raw=td.decode(cd.subarray(p+46,p+46+nl));p+=46+nl+xl+cl;
      const mm=raw.match(/(?:^|\/)((?:mh|as|meta|lib)\/.+)$/),name=mm&&!raw.endsWith("/")?mm[1]:null;
      if(!name||(meth!==0&&meth!==8)){skipped++;continue;}
      ents.push({name,meth,csz,lo});
    }
    ents.sort((a,b)=>a.lo-b.lo);
    /* نقرأ الأرشيف كتلاً كبيرة متصلة بدل قراءة كل ملف على حدة (أسرع بكثير)، ثم نكتب دفعات كبيرة */
    const ends=ents.map((x,i)=>i+1<ents.length?ents[i+1].lo:cdOff);
    let i=0,done=0,batch=[],bsz=0,pend=[];
    const flush=async()=>{if(pend.length){await Promise.all(pend);pend=[];}if(batch.length){await putMany(batch);batch=[];bsz=0;}};

      for(const pr in Pr)if(Pr[pr]>1e-4)W["macrodetails/proportions/"+k2+"-"+pr+"proportions"]=w*Pr[pr];

        jobs.push(lim(async()=>{
          try{const d=await inflate(raw);
            if(d.length!==x.usz)bad(x,"الحجم بعد الفك مختلف","المتوقع "+x.usz+" والفعلي "+d.length);
            else if(crc(d)!==x.crc)bad(x,"CRC لا يطابق","البيانات تالفة");
            else res.ok++;
          }catch(er){bad(x,"فك الضغط فشل",String(er&&er.message||er));}
        }));
      }
      await Promise.all(jobs);
      done+=j-i+1;upd(done,ents.length,res.bad.length);
      await new Promise(r=>setTimeout(r,0));
      i=j+1;
    }
    return res;
  }
  function report(R,t0,stopped){
    const o=["== فحص الحزمة | "+new Date().toISOString()+(stopped?" | أُوقف يدوياً":"")+" | المدة: "+((performance.now()-t0)/1000).toFixed(1)+"ث"];
    for(const x of R){
      o.push("","الملف: "+x.name+" | "+(x.size/1048576).toFixed(1)+" ميجابايت");
      if(x.fatal){o.push("خطأ في الملف نفسه: "+x.fatal);continue;}
      o.push("عدد الملفات داخل الحزمة: "+x.total+" | سليم: "+x.ok+" | به خطأ: "+x.bad.length);
      x.notes.forEach(n=>o.push("ملاحظة: "+n));
      if(x.bad.length){
        o.push("-- أنواع الأخطاء:");for(const k in x.cats)o.push(x.cats[k]+" × "+k);
        const g=new Map();x.bad.forEach(b=>{const a=assetOf(b.n);g.set(a,(g.get(a)||0)+1);});
        o.push("-- العناصر المتأثرة ("+g.size+"):");[...g].slice(0,60).forEach(([a,c])=>o.push(a+" ("+c+" ملف)"));
        o.push("-- تفاصيل الأخطاء (أول 60):");x.bad.slice(0,60).forEach(b=>o.push(b.n+" | "+b.t+" | "+b.d));
        if(x.bad.length>60)o.push("... و "+(x.bad.length-60)+" خطأ آخر");
      }
      o.push(x.partial?"الخلاصة: لم يكتمل الفحص.":x.bad.length?"الخلاصة: الحزمة بها ملفات تالفة. نزّلها أو انسخها من جديد ثم استوردها.":"الخلاصة: الحزمة سليمة بالكامل. لو بقيت ملابس لا تظهر فالمشكلة في طريقة قراءة التطبيق وليس في الملف.");
    }
    return o.join("\n");
  }
  /*ZCK-CORE-END*/
  let stp=false,running=false,last=[],cur=null,pend=false;
  window.__zckWait=()=>cur||Promise.resolve();
  const ui=on=>{Q("#zcr").disabled=on;Q("#zcx").disabled=!on;};
  async function runAll(fs){
    if(running||!fs.length)return;
    running=true;stp=false;last=fs;ui(true);
    const t0=performance.now(),R=[];let lastUp=0;
    try{
      for(let q=0;q<fs.length&&!stp;q++){
        const f=fs[q],pre=fs.length>1?"("+(q+1)+"/"+fs.length+") ":"";
        setS(pre+"جاري فحص "+f.name+" ...");Q("#zcb").style.width="0";
        let res;
        try{res=await scanFile(f,(d,t,b)=>{const now=performance.now();if(now-lastUp<150&&d<t)return;lastUp=now;const p=Math.round(d/Math.max(1,t)*100);Q("#zcb").style.width=p+"%";setS(pre+"فحص الحزمة: "+d+" / "+t+" · "+p+"% · "+((now-t0)/1000).toFixed(0)+"ث · أخطاء: "+b);});}
        catch(er){res={name:f.name,size:f.size,total:0,ok:0,bad:[],notes:[],cats:{},fatal:"تعذرت قراءة الملف: "+(er&&er.message||er)};}
        if(stp)res.partial=true;
        R.push(res);
      }
    }finally{
      const stopped=stp;stp=false;running=false;ui(false);
      Q("#zct").value=report(R,t0,stopped);Q("#zcb").style.width="100%";
      const nb=R.reduce((a,x)=>a+x.bad.length,0),nf=R.filter(x=>x.fatal).length;
      setS((stopped?"أُوقف":"اكتمل")+" · "+(nf?"ملف به خطأ في هيكله · ":"")+"ملفات تالفة داخل الحزمة: "+nb);
    }
  }
  const start=fs=>{cur=runAll(fs);return cur;};
  inp.addEventListener("change",()=>{const fs=[...(inp.files||[])];if(fs.length){last=fs;pend=true;}});
  Q("#zcr").onclick=()=>{if(!running&&last.length)start(last);else if(!last.length)setS("لا توجد حزمة مستوردة بعد.");};
  Q("#zcx").onclick=()=>{if(running){stp=true;setS("جاري الإيقاف...");Q("#zcx").disabled=true;}};
  Q("#zcc").onclick=()=>{const ta=Q("#zct");ta.select();try{navigator.clipboard.writeText(ta.value);}catch(e){document.execCommand("copy");}};
})();
</script>
