<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صفحة الإنقاذ</title><style>body{font-family:sans-serif;max-width:640px;margin:0 auto;padding:16px;background:#111;color:#eee}input,button{width:100%;padding:12px;margin:6px 0;font-size:16px;box-sizing:border-box;border-radius:8px;border:1px solid #666;background:#222;color:#eee}button{background:#2d6cdf;border:0;color:#fff}.r{border:1px solid #555;border-radius:8px;padding:10px;margin:8px 0}.r small{display:block;opacity:.7}</style></head><body><h2>🛟 صفحة الإنقاذ</h2><p>لو الموقع الرئيسي باظ، اختار نسخة سليمة من هنا وارجع لها.</p><input id="u" placeholder="اليوزر"><input id="r" placeholder="اسم المستودع"><input id="t" type="password" placeholder="Token"><button id="go">عرض النسخ</button><div id="s"></div><div id="l"></div><script>var $=function(i){return document.getElementById(i)};function say(m){$("s").textContent=m}try{$("u").value=localStorage.getItem("af_user")||"";$("t").value=localStorage.getItem("af_token")||"";$("r").value=localStorage.getItem("af_updrepo")||location.pathname.split("/")[1]||"webtool"}catch(e){}function g(p,o){o=o||{};o.headers={Authorization:"Bearer "+$("t").value.trim(),Accept:"application/vnd.github+json"};return fetch("https://api.github.com"+p,o)}function P(){return "/repos/"+$("u").value.trim()+"/"+$("r").value.trim()}$("go").onclick=async function(){say("جاري التحميل...");$("l").innerHTML="";try{var r=await g(P()+"/commits?path=index.html&per_page=30");if(!r.ok)throw new Error("فشل: "+r.status);var a=await r.json();say("");a.forEach(function(c){var d=document.createElement("div");d.className="r";var t=document.createElement("div");t.textContent=c.commit.message.split("\n")[0];var m=document.createElement("small");m.textContent=new Date(c.commit.committer.date).toLocaleString("ar")+" — "+c.sha.slice(0,7);var b=document.createElement("button");b.textContent="↩️ ارجع للنسخة دي";b.onclick=function(){back(c.sha)};d.appendChild(t);d.appendChild(m);d.appendChild(b);$("l").appendChild(d)})}catch(e){say("خطأ: "+e.message)}};async function back(sha){if(!confirm("ترجّع النسخة دي؟"))return;say("جاري الاسترجاع...");try{var r=await g(P()+"/contents/index.html?ref="+sha);if(!r.ok)throw new Error("تعذّر قراءة النسخة");var j=await r.json();var c=(j.content||"").replace(/\s/g,"");if(atob(c).indexOf("TEMPLATE_FILES")<0)throw new Error("النسخة دي مش صالحة");var x=await g(P()+"/contents/index.html");var sh=x.ok?(await x.json()).sha:undefined;var p=await g(P()+"/contents/index.html",{method:"PUT",body:JSON.stringify({message:"Rescue restore "+sha.slice(0,7),content:c,sha:sh})});if(!p.ok)throw new Error("فشل الرفع: "+p.status);say("✅ اتسترجعت. استنى دقيقة وافتح الموقع.")}catch(e){say("خطأ: "+e.message)}}</script></body></html>
